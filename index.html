<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1A31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>REFRICAR — Gestão de Orçamentos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: menu lateral azul-marinho fixo + área de trabalho clara; no celular o menu vira gaveta. */
:root{
  --side:#0A1A31; --side-2:#11284A; --side-fg:#B9C9E2; --side-hi:#FFFFFF;
  --navy:#0B1F3A; --blue:#1E6FD9; --blue-strong:#1559B5; --blue-soft:#E6EEFB;
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DAE2EE; --line-2:#C9D5E6;
  --text:#0D1A2C; --muted:#5A6A80; --faint:#8495AB;
  --ok:#11804C; --ok-soft:#E2F4EA; --warn:#A86A12; --warn-soft:#FCF1DC; --bad:#BE2E2E; --bad-soft:#FBE6E6; --gray:#4F6079; --gray-soft:#EAEFF5;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 6px 18px rgba(11,31,58,.06);
  --font-d:'Sora','Segoe UI',system-ui,sans-serif;
  --font-b:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side:#050E1C; --side-2:#0E2140; --side-fg:#A9BBD6; --side-hi:#FFFFFF;
  --navy:#CFE0F7; --blue:#4D94F2; --blue-strong:#77ACF6; --blue-soft:#14294A;
  --bg:#081222; --surface:#0E1B30; --surface-2:#12233D; --line:#1E3354; --line-2:#2A4268;
  --text:#E4ECF7; --muted:#93A6C0; --faint:#6D819E;
  --ok:#45C486; --ok-soft:#0F2D20; --warn:#E3AA45; --warn-soft:#33260E; --bad:#F07575; --bad-soft:#3A1818; --gray:#A3B3C9; --gray-soft:#17283F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#050E1C; --side-2:#0E2140; --side-fg:#A9BBD6; --side-hi:#FFFFFF;
  --navy:#CFE0F7; --blue:#4D94F2; --blue-strong:#77ACF6; --blue-soft:#14294A;
  --bg:#081222; --surface:#0E1B30; --surface-2:#12233D; --line:#1E3354; --line-2:#2A4268;
  --text:#E4ECF7; --muted:#93A6C0; --faint:#6D819E;
  --ok:#45C486; --ok-soft:#0F2D20; --warn:#E3AA45; --warn-soft:#33260E; --bad:#F07575; --bad-soft:#3A1818; --gray:#A3B3C9; --gray-soft:#17283F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Menu lateral ---------- */
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 4px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(150deg,#2B7DE9,#123D78);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-family:var(--font-d);color:#fff;font-size:17px;letter-spacing:.14em;font-weight:700}
.brand small{display:block;font-size:11.5px;color:var(--side-fg);opacity:.85;margin-top:1px}
.side-cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px 12px;font-weight:600;cursor:pointer}
.side-cta:hover{background:#2C7BE6}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6F86A8;padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 #3B8BF0}
.nav a .cnt{margin-left:auto;font-size:11.5px;color:#7D93B4;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.store-pill{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 10px;border-radius:8px;background:var(--side-2);color:var(--side-fg);cursor:pointer;border:0;text-align:left}
.store-pill i{width:8px;height:8px;border-radius:50%;background:#45C486;flex:none}
.store-pill.warn i{background:#E3AA45}
.store-pill.bad i{background:#F07575}

.topbar{display:none}
.scrim{display:none}

/* ---------- Área principal ---------- */
.main{margin-left:252px;min-height:100%;padding-block:28px 72px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:25px;font-weight:600;color:var(--text)}
.ph p{margin:5px 0 0;color:var(--muted);max-width:62ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 13px;font-weight:550;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px;line-height:1.2}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-strong);border-color:var(--blue-strong);color:#fff}
.btn-wa{background:#1A9E58;border-color:#1A9E58;color:#fff}
.btn-wa:hover{background:#15864A;border-color:#15864A;color:#fff}
.btn-danger{color:var(--bad);border-color:var(--line-2)}
.btn-danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn-danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-lg{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.ibtn:hover{background:var(--gray-soft);color:var(--text)}
.ibtn.del:hover{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600}
.card-h .step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700;margin-right:9px;font-family:var(--font-b)}
.card-b{padding:18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field>span em{font-style:normal;color:var(--faint);font-weight:500}
.inp{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
select.inp{cursor:pointer}
.inp.r{text-align:right;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:500}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:3px;background:var(--surface-2);gap:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:550;font-size:13px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--blue)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-elaboracao{background:var(--gray-soft);color:var(--gray)}
.st-enviado{background:var(--blue-soft);color:var(--blue)}
.st-aprovado{background:var(--ok-soft);color:var(--ok)}
.st-recusado{background:var(--bad-soft);color:var(--bad)}
.st-concluido{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ok)}
select.st-sel{border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--gray-soft);color:var(--gray);font-size:11.5px;font-weight:600}
.tag.off{background:var(--bad-soft);color:var(--bad)}
.tag.zero{background:var(--warn-soft);color:var(--warn)}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse}
.dtable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.dtable td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable tbody tr:hover td{background:var(--surface-2)}
.dtable .r{text-align:right}
.dtable .acts{display:flex;gap:2px;justify-content:flex-end}
.dtable td.strong{font-weight:600}
.dtable .sub{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.dtable tr.off td{opacity:.55}
.empty{padding:38px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--text);font-size:15px;font-family:var(--font-d);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 18px;border-bottom:1px solid var(--line)}
.filters .field{flex:1 1 160px}
.filters .grow{flex:3 1 240px}
.search{position:relative}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .inp{padding-left:34px}

/* ---------- Painel ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-family:var(--font-d);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi small{color:var(--muted)}
.kpi.k-ok b{color:var(--ok)} .kpi.k-warn b{color:var(--warn)}
.hero{background:linear-gradient(120deg,#0B1F3A 0%,#123A6E 70%,#1A56A3 100%);color:#fff;border-radius:12px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero h1{font-size:23px;color:#fff;font-weight:600}
.hero p{margin:6px 0 0;color:#B8CBE6;max-width:58ch}
.hero .btn-primary{background:#fff;color:#0B1F3A;border-color:#fff}
.hero .btn-primary:hover{background:#E6EEFB;color:#0B1F3A}
.hero svg.fan{position:absolute;right:-30px;bottom:-60px;opacity:.08;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
.qbtn:hover{border-color:var(--blue);transform:translateY(-1px)}
.qbtn .qi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.qbtn b{font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
.qbtn small{color:var(--muted);font-size:12px}
.qbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.qbtn.primary .qi{background:rgba(255,255,255,.18);color:#fff}
.qbtn.primary small{color:#D6E5FB}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}
.bar-row .track{grid-column:1/-1;height:7px;border-radius:9px;background:var(--gray-soft);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:9px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.notice .ic{margin-top:1px}
.notice.warn .ic{color:var(--warn)} .notice.info .ic{color:var(--blue)}
.notice div{flex:1;min-width:0}
.notice b{display:block;margin-bottom:2px}

/* ---------- Editor de orçamento ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.its-head,.it{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 72px 100px 96px 30px;gap:6px;align-items:center}
.its-head{padding:0 12px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.its-head .r{text-align:right}
.its{display:flex;flex-direction:column;gap:6px}
.it{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.it:hover{border-color:var(--line-2)}
.it .inp{padding:7px 9px}
.it-ord{display:flex;flex-direction:column;gap:0}
.it-ord button{border:0;background:transparent;color:var(--faint);cursor:pointer;height:16px;display:grid;place-items:center;padding:0;border-radius:4px}
.it-ord button:hover{color:var(--blue);background:var(--blue-soft)}
.it-desc{display:flex;flex-direction:column;gap:4px;min-width:0}
.it-desc .inp{font-weight:500}
.tsel{align-self:flex-start;border:0;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;cursor:pointer;text-transform:uppercase}
.t-servico{background:var(--blue-soft);color:var(--blue)}
.t-material{background:var(--warn-soft);color:var(--warn)}
.t-adicional{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.it-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.it-f>span{display:none;font-size:11px;color:var(--muted);font-weight:600}
.it-hint{font-size:11px;color:var(--warn);text-align:right;white-space:nowrap}
.it-sub{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.it.tit{grid-template-columns:22px minmax(0,1fr) 30px;background:var(--surface-2);border-style:dashed}
.it.tit .inp{font-family:var(--font-d);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.taxas{display:flex;flex-direction:column;gap:8px}
.taxa{display:grid;grid-template-columns:minmax(0,1fr) 140px 34px;gap:8px;align-items:center}

.sum{padding:18px}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sum-row span{color:var(--muted)}
.sum-row b{font-weight:600}
.sum-row.neg b{color:var(--bad)}
.sum-total{margin-top:14px;padding:14px 16px;border-radius:9px;background:#0B1F3A;color:#fff;display:flex;flex-direction:column;gap:2px}
.sum-total span{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:#9DB6DA;font-weight:600}
.sum-total b{font-family:var(--font-d);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums}
.side-acts{display:flex;flex-direction:column;gap:8px;padding:0 18px 18px}
.side-acts .btn{width:100%}
.meta-l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.meta-l b{font-family:var(--font-d);font-size:17px}
.dirty-dot{font-size:12px;color:var(--warn);font-weight:600}

/* Modelos */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column}
.mcard .mb{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.mcard h3{font-size:15.5px;font-weight:600}
.mcard .mt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.mcard .mt b{font-family:var(--font-d);font-size:19px;font-variant-numeric:tabular-nums}
.mcard ul{margin:0;padding-left:17px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.mcard .mf{display:flex;gap:6px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}
.mcard .mf .btn-primary{margin-right:auto}

/* Modal */
.mwrap{position:fixed;inset:0;background:rgba(5,14,28,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;animation:fade .14s ease}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;margin:auto 0;border:1px solid var(--line)}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-h h2{font-size:17px;font-weight:600}

const addDays=(iso,n)=>{const d=new Date((iso||hoje())+'T12:00:00');d.setDate(d.getDate()+num(n));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtNumero=n=>n?String(n).padStart(4,'0'):'—';
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const byName=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR');
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks[ks.length-1]]=v};
const cleanObj=o=>JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout',message:'Tempo esgotado'}),ms))]);

const AND=window.RefricarAndroid||null;
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b)});
/* ---------- toast & modal ---------- */
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.innerHTML=icon(err?'alert':'check',16)+'<span></span>';t.querySelector('span').textContent=msg;$('#toasts').appendChild(t);const all=$$('#toasts .toast');if(all.length>2)all[0].remove();setTimeout(()=>t.remove(),err?5000:2200)}
let modalStack=[];
function modal({title,body,foot,wide,onClose}){
  const w=document.createElement('div');w.className='mwrap';
  w.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h2></h2><button class="ibtn" data-close aria-label="Fechar">${icon('x')}</button></div><div class="modal-b">${body||''}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  w.querySelector('h2').textContent=title;
  const close=()=>{w.remove();modalStack=modalStack.filter(x=>x!==w);onClose&&onClose()};
  w.addEventListener('click',e=>{if(e.target===w||e.target.closest('[data-close]'))close()});
  w._close=close;document.body.appendChild(w);modalStack.push(w);
  const f=w.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');if(f&&!('ontouchstart' in window))setTimeout(()=>f.focus(),30);
  return w;
}
function closeModal(){const w=modalStack[modalStack.length-1];if(w)w._close()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)closeModal()});
function ask(msg,{title='Confirmar',ok='Confirmar',danger=false,cancel='Cancelar'}={}){
  return new Promise(res=>{let done=false;
    const w=modal({title,body:`<p style="margin:0;line-height:1.55"></p>`,foot:`<button class="btn" data-close>${esc(cancel)}</button><button class="btn ${danger?'btn-danger solid':'btn-primary'}" data-ok>${esc(ok)}</button>`,onClose:()=>{if(!done)res(false)}});
    w.querySelector('p').textContent=msg;
    w.querySelector('[data-ok]').onclick=()=>{done=true;w._close();res(true)};
  });
}

/* =========================================================
   ARMAZENAMENTO — nuvem (banco do artefato) ou local (IndexedDB)
   ========================================================= */
const Cloud={db:null,dl:null,
  async init(){
    const db=await window.claude.use('db');if(!db)return false;this.db=db;
    try{this.dl=await window.claude.use('downloads')}catch(e){this.dl=null}
    for(const c of COLS){const snap=await withTimeout(this.retry(()=>db.collection(c).get()),20000);S.data[c]=snap.docs.map(d=>({...d.data(),id:d.id}))}
    const cs=await withTimeout(this.retry(()=>db.doc('config/empresa').get()),20000);S.config=cs.exists?{...cs.data()}:{};
    return true;
  },
  async retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*600);return fn()}throw e}},
  put(c,o){return this.retry(()=>this.db.collection(c).doc(o.id).set(cleanObj(o)))},
  del(c,id){return this.retry(()=>this.db.collection(c).doc(id).delete())},
  saveConfig(cfg){return this.retry(()=>this.db.doc('config/empresa').set(cleanObj(cfg)))}
};
const Local={idb:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('refricar-orcamentos',1);r.onupgradeneeded=()=>{const d=r.result;[...COLS,'meta'].forEach(c=>{if(!d.objectStoreNames.contains(c))d.createObjectStore(c,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('bloqueado'))})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async init(){this.idb=await this.open();for(const c of COLS)S.data[c]=(await this.req(c,'readonly',s=>s.getAll()))||[];const m=await this.req('meta','readonly',s=>s.get('config'));S.config=m?m.value:{};try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return true},
  put(c,o){return this.req(c,'readwrite',s=>s.put(cleanObj(o)))},
  del(c,id){return this.req(c,'readwrite',s=>s.delete(id))},
  saveConfig(cfg){return this.req('meta','readwrite',s=>s.put({id:'config',value:cleanObj(cfg)}))},
  async getMeta(k){const r=await this.req('meta','readonly',s=>s.get(k));return r?r.value:null},
  setMeta(k,v){return this.req('meta','readwrite',s=>s.put({id:k,value:v}))}
};
/* Supabase (site publicado no GitHub) */
const Supa={sb:null,user:null,
  cfg(){const c=window.REFRICAR_CONFIG||{};let url=c.supabaseUrl,key=c.supabaseAnonKey,fonte='arquivo';
    if(!url||!key){try{const l=JSON.parse(localStorage.getItem('refricar_supabase')||'null');if(l&&l.url&&l.key){url=l.url;key=l.key;fonte='navegador'}}catch(e){}}
    return url&&key?{url:String(url).trim().replace(/\/+$/,''),key:String(key).trim(),fonte}:null},
  async init(){const c=this.cfg();if(!window.supabase||!window.supabase.createClient)throw new Error('lib');
    this.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'refricar-auth'}});
    const {data}=await this.sb.auth.getSession();this.user=data&&data.session?data.session.user:null;
    this.sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'){this.user=null;telaLogin()}else if(ses)this.user=ses.user});return true},
  async load(){COLS.forEach(c=>S.data[c]=[]);S.config={};let from=0;
    for(;;){const {data,error}=await this.sb.from('registros').select('colecao,id,dados').order('colecao').order('id').range(from,from+999);if(error)throw error;
      data.forEach(r=>{if(r.colecao==='config')S.config={...(r.dados||{})};else if(S.data[r.colecao])S.data[r.colecao].push({...(r.dados||{}),id:r.id})});
      if(data.length<1000)break;from+=1000}},
  async put(c,o){const {error}=await this.sb.from('registros').upsert({owner:this.user.id,colecao:c,id:o.id,dados:cleanObj(o),atualizado_em:new Date().toISOString()},{onConflict:'owner,colecao,id'});if(error)throw error},
  async del(c,id){const {error}=await this.sb.from('registros').delete().eq('colecao',c).eq('id',id);if(error)throw error},
  saveConfig(cfg){return this.put('config',{...cfg,id:'empresa'})}
};
const Mem={async init(){return true},async put(){},async del(){},async saveConfig(){}};
let backend=Mem;

/* Arquivo de dados vinculado (modo local, Chrome/Edge no computador) */
const FileLink={handle:null,status:'none',last:null,t:null,
  supported(){return S.mode==='local'&&typeof window.showSaveFilePicker==='function'},
  async load(){if(!this.supported())return;try{const h=await Local.getMeta('fileHandle');if(h){this.handle=h;const p=await h.queryPermission({mode:'readwrite'});this.status=p==='granted'?'ok':'reconnect'}}catch(e){}},
  async link(){try{const h=await window.showSaveFilePicker({suggestedName:'refricar-dados.json',types:[{description:'Banco de dados REFRICAR',accept:{'application/json':['.json']}}]});this.handle=h;await Local.setMeta('fileHandle',h);this.status='ok';await this.write();toast('Arquivo de dados vinculado. Cada alteração será gravada nele.')}catch(e){if(e&&e.name!=='AbortError')toast('Não foi possível vincular o arquivo.',true)}renderSide();if(S.view==='empresa')render()},
  async reconnect(){try{const p=await this.handle.requestPermission({mode:'readwrite'});this.status=p==='granted'?'ok':'reconnect';if(this.status==='ok'){await this.write();toast('Arquivo de dados reconectado.')}}catch(e){toast('Não foi possível reconectar o arquivo.',true)}renderSide();if(S.view==='empresa')render()},
  async unlink(){this.handle=null;this.status='none';try{await Local.setMeta('fileHandle',null)}catch(e){}renderSide();render()},
  schedule(){if(this.status!=='ok')return;clearTimeout(this.t);this.t=setTimeout(()=>this.write(),1200)},
  async write(){try{const w=await this.handle.createWritable();await w.write(JSON.stringify(exportData(),null,1));await w.close();this.last=new Date()}catch(e){this.status='reconnect';renderSide()}}
};

const DB={
  async put(c,o){o.atualizadoEm=new Date().toISOString();await backend.put(c,o);const a=S.data[c];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);FileLink.schedule()},
  async del(c,id){await backend.del(c,id);S.data[c]=S.data[c].filter(x=>x.id!==id);FileLink.schedule()},
  async saveConfig(cfg){await backend.saveConfig(cfg);S.config=cfg;FileLink.schedule()}
};
function dbErr(e){console.error(e);const q=e&&e.code==='quota_exceeded';toast(q?'O banco de dados está cheio. Exclua orçamentos antigos ou exporte um backup.':'Não foi possível salvar. Verifique a conexão e tente novamente.',true)}

function exportData(){return {app:'refricar-orcamentos',versao:1,exportadoEm:new Date().toISOString(),config:S.config,...Object.fromEntries(COLS.map(c=>[c,S.data[c]]))}}

/* ---------- downloads ---------- */
async function salvarArquivo(nome,blob){
  if(AND){try{const r=AND.salvar(nome,blob.type||'application/octet-stream',await blobB64(blob));return r==='ok'}catch(e){toast('Não foi possível salvar o arquivo.',true);return false}}
  if(S.mode==='nuvem'&&Cloud.dl){try{await Cloud.dl.save({filename:nome,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('Aguarde a janela de download anterior.',true);return false}}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('Não foi possível baixar o arquivo.',true);return false}
}

/* =========================================================
   CÁLCULOS
   ========================================================= */
function calc(d){
  let mat=0,mo=0,ad=0;
  for(const it of d.itens||[]){if(it.tipo==='titulo')continue;const s=num(it.qtd)*num(it.valor);if(it.tipo==='material')mat+=s;else if(it.tipo==='servico')mo+=s;else ad+=s}
  const taxas=(d.taxas||[]).reduce((a,t)=>a+num(t.valor),0);
  const sub=mat+mo+ad;const bruto=sub+taxas;
  let desc=d.descontoTipo==='%'?sub*num(d.descontoValor)/100:num(d.descontoValor);
  desc=Math.max(0,Math.min(desc,bruto));
  return {mat:r2(mat),mo:r2(mo),ad:r2(ad),taxas:r2(taxas),sub:r2(sub),bruto:r2(bruto),desc:r2(desc),total:r2(bruto-desc)};
}

}

async function go(view,{force}={}){

  }
  S.dirty=false;

  S.view=VIEWS_OK.includes(view)?view:'painel';
  if((S.view==='orcamento'||S.view==='modelo')&&!S.draft)S.view=S.view==='modelo'?'modelos':'orcamentos';
  if(location.hash.slice(1)!==S.view)history.replaceState(null,'','#'+S.view);

}

     <div class="it-sub" data-sub="${it.id}">${brl(num(it.qtd)*num(it.valor))}</div>${del}</div>`;

function picker(tipo){
  const lista=catalogo(tipo).filter(x=>x.ativo!==false);let q='',cat='';
  const cats=[...new Set(lista.map(x=>x.categoria).filter(Boolean))].sort();
  const w=modal({title:tipo==='material'?'Adicionar material cadastrado':'Adicionar serviço cadastrado',wide:true,body:`
    <div class="search">${icon('search',16)}<input class="inp" id="pk-q" placeholder="Pesquisar pelo nome"></div>
    ${cats.length?`<div class="chips" id="pk-c"><button class="chip on" data-c="">Todas</button>${cats.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
    <div class="pick-list" id="pk-l"></div>`,foot:`<span class="muted small" style="margin-right:auto;align-self:center" id="pk-n"></span><button class="btn btn-primary" data-close>Concluir</button>`});
  let added=0;
  const draw=()=>{const a=lista.filter(x=>(!cat||x.categoria===cat)&&(!q||norm(x.nome+' '+(x.descricao||'')).includes(norm(q)))).sort(byName);
    w.querySelector('#pk-l').innerHTML=a.length?a.map(x=>`<div class="pick"><div><b>${esc(x.nome)}</b><small>${esc([x.categoria,x.unidade].filter(Boolean).join(' · '))}</small></div><span class="pv">${num(x.valor)?brl(x.valor):'<span class="tag zero">Sem preço</span>'} <span class="muted small">/ ${esc(x.unidade||'un.')}</span></span><button class="btn btn-sm" data-add="${x.id}">${icon('plus',15)} Adicionar</button></div>`).join('')
      :`<div class="empty">${lista.length?'Nada encontrado.':`<b>Nenhum ${tipo==='material'?'material':'serviço'} ativo cadastrado</b>Cadastre em ${tipo==='material'?'Materiais':'Serviços'}.`}</div>`};
  draw();
  w.querySelector('#pk-q').addEventListener('input',e=>{q=e.target.value;draw()});
  w.querySelector('#pk-c')?.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;w.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));draw()});
  w.querySelector('#pk-l').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const x=lista.find(i=>i.id===b.dataset.add);
    const ex=S.draft.itens.find(i=>i.refId===x.id&&i.tipo===tipo);
    if(ex){ex.qtd=num(ex.qtd)+1;toast(`${x.nome}: quantidade agora ${fmtQtd(ex.qtd)}`)}else{S.draft.itens.push(itemDe(tipo,x));toast('Adicionado: '+x.nome)}
    added++;w.querySelector('#pk-n').textContent=added+' adicionado(s)';reItens()});
}

async function salvarDraft(){
  const d=S.draft;const isM=d.kind==='modelo';
  d.itens.forEach(it=>{if(it.tipo!=='titulo'){it.qtd=num(it.qtd);it.valor=r2(it.valor)}});
  d.taxas.forEach(t=>t.valor=r2(t.valor));d.descontoValor=num(d.descontoValor);d.validadeDias=num(d.validadeDias);
  if(isM){
    if(!String(d.nome).trim()){toast('Dê um nome ao modelo.',true);$('[data-bind="nome"]')?.focus();return false}
    const m={id:d.id,nome:d.nome.trim(),descricao:d.descricao||'',titulo:d.titulo,escopo:d.escopo,
      itens:d.itens.map(it=>{const c=findCat(it);const o={...it};if(c)o.fixo=r2(c.valor)!==r2(it.valor);return o}),
      descontoTipo:d.descontoTipo,descontoValor:d.descontoValor,taxas:d.taxas,observacoes:d.observacoes,condicoes:d.condicoes,prazo:d.prazo,validadeDias:d.validadeDias,garantia:d.garantia,pdf:d.pdf,
      criadoEm:d.criadoEm||new Date().toISOString()};
    try{await DB.put('modelos',m);d.criadoEm=m.criadoEm;S.dirty=false;toast('Modelo salvo.');render();return true}catch(e){dbErr(e);return false}
  }
  if(!String(d.cliente.nome).trim()){toast('Informe o nome do cliente.',true);$('[data-bind="cliente.nome"]')?.focus();return false}
  try{
    const cd={nome:d.cliente.nome.trim(),telefone:(d.cliente.telefone||'').trim(),doc:(d.cliente.doc||'').trim(),endereco:(d.cliente.endereco||'').trim()};
    let cli=d.clienteId&&S.data.clientes.find(c=>c.id===d.clienteId);
    if(cli){if(['nome','telefone','doc','endereco'].some(k=>(cli[k]||'')!==cd[k]))await DB.put('clientes',{...cli,...cd})}
    else{const novo={id:uid(),...cd,email:'',criadoEm:new Date().toISOString()};await DB.put('clientes',novo);d.clienteId=novo.id}
    d.cliente=cd;
    if(!d.numero)d.numero=S.data.orcamentos.reduce((a,o)=>Math.max(a,num(o.numero)),0)+1;
    const c=calc(d);
    const o={...clone(d),total:c.total,resumo:c,criadoEm:d.criadoEm||new Date().toISOString()};delete o.kind;
    await DB.put('orcamentos',o);d.criadoEm=o.criadoEm;S.dirty=false;
    toast(`Orçamento Nº ${fmtNumero(d.numero)} salvo.`);render();return true;
  }catch(e){dbErr(e);return false}
}

function gerarPDF(o){
  if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('O gerador de PDF não carregou. Verifique a conexão com a internet e recarregue a página.');
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  if(typeof doc.autoTable!=='function')throw new Error('O gerador de tabelas do PDF não carregou. Recarregue a página.');
  const cfg=S.config,P={...DEFAULT_PDF,...(o.pdf||{})};const W=210,H=297,M=14,CW=W-2*M;
  const C={navy:[11,31,58],navy2:[19,48,90],blue:[30,111,217],soft:[236,242,251],line:[214,224,237],text:[22,32,48],muted:[96,112,134],white:[255,255,255],pale:[184,203,230],red:[176,40,40]};
  const T=s=>String(s??'').replace(/[  ]/g,' ').replace(/[−–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  const money=n=>T(brl(n));
  const fill=c=>doc.setFillColor(c[0],c[1],c[2]),color=c=>doc.setTextColor(c[0],c[1],c[2]),stroke=c=>doc.setDrawColor(c[0],c[1],c[2]);
  const font=(st,sz)=>{doc.setFont('helvetica',st||'normal');doc.setFontSize(sz||9.5)};
  const numero=fmtNumero(o.numero);const validade=num(o.validadeDias)?fmtDate(addDays(o.data,o.validadeDias)):'';
  const cli=o.cliente||{};const TOP=20,BOT=H-24;let y;
  const ensure=h=>{if(y+h>BOT){doc.addPage();y=TOP}};
  const label=(t,x,yy)=>{font('bold',7.6);color(C.blue);doc.text(T(t).toUpperCase(),x,yy)};
  const lines=(arr,x,lh)=>{arr.forEach(l=>{ensure(lh);doc.text(l,x,y+3.2);y+=lh})};

  /* Cabeçalho */
  fill(C.navy);doc.rect(0,0,W,42,'F');fill(C.navy2);doc.rect(W-74,0,74,42,'F');fill(C.blue);doc.rect(0,42,W,1.4,'F');
  let tx=M;
  if(cfg.logo){try{const p=doc.getImageProperties(cfg.logo);const box=25;fill(C.white);doc.roundedRect(M,8.5,box,box,2.5,2.5,'F');let w=box-4,h=w*p.height/p.width;if(h>box-4){h=box-4;w=h*p.width/p.height}doc.addImage(cfg.logo,p.fileType==='JPEG'?'JPEG':'PNG',M+(box-w)/2,8.5+(box-h)/2,w,h);tx=M+box+6}catch(e){console.warn(e)}}
  const maxW=W-74-tx-5;
  color(C.white);font('bold',21);doc.text(doc.splitTextToSize(T(cfg.nome||'REFRICAR'),maxW)[0],tx,18.5);
  font('normal',8.4);color(C.pale);let hy=24.5;
  const hl=[cfg.slogan,[cfg.telefone&&('Tel. '+cfg.telefone),cfg.whatsapp&&('WhatsApp '+cfg.whatsapp)].filter(Boolean).join('  |  '),[cfg.email,cfg.cnpj&&('CNPJ '+cfg.cnpj)].filter(Boolean).join('  |  '),cfg.endereco].filter(Boolean);
  hl.slice(0,4).forEach(l=>{doc.text(doc.splitTextToSize(T(l),maxW)[0],tx,hy);hy+=4.1});
  const rx=W-M;font('bold',8);color(C.pale);doc.text('ORÇAMENTO',rx,12.5,{align:'right'});
  color(C.white);font('bold',19);doc.text('Nº '+numero,rx,21.5,{align:'right'});
  font('normal',8.4);color(C.pale);doc.text('Emissão: '+fmtDate(o.data),rx,28.5,{align:'right'});if(validade)doc.text('Válido até: '+validade,rx,33,{align:'right'});
  y=51;

  /* Cliente */
  label('Dados do cliente',M,y);y+=3;
  const flds=[{l:'Cliente',v:cli.nome,b:true},{l:'Telefone / WhatsApp',v:cli.telefone}];
  if(P.mostrarDoc&&cli.doc)flds.push({l:'CPF / CNPJ',v:cli.doc});
  const pd=4.5,colW=(CW-pd*2)/2;font('normal',9.5);
  const addr=cli.endereco?doc.splitTextToSize(T(cli.endereco),CW-pd*2):[];
  const pr=Math.ceil(flds.length/2);const boxH=pd+pr*10.5+(addr.length?3+addr.length*4.3+3:0)+1;
  fill(C.soft);doc.roundedRect(M,y,CW,boxH,2,2,'F');
  flds.forEach((f,i)=>{const cx=M+pd+(i%2)*colW,ry=y+pd+3+Math.floor(i/2)*10.5;font('bold',6.8);color(C.muted);doc.text(f.l.toUpperCase(),cx,ry);font(f.b?'bold':'normal',10);color(C.text);doc.text(doc.splitTextToSize(T(f.v||'-'),colW-4)[0],cx,ry+4.8)});
  if(addr.length){const ry=y+pd+3+pr*10.5;font('bold',6.8);color(C.muted);doc.text('ENDEREÇO',M+pd,ry);font('normal',9.5);color(C.text);doc.text(addr,M+pd,ry+4.8)}
  y+=boxH+8;

  /* Título */
  if(o.titulo){font('bold',13.5);color(C.navy);const tl=doc.splitTextToSize(T(o.titulo),CW);ensure(tl.length*6+4);doc.text(tl,M,y+2);y+=tl.length*6+3}

  /* Serviços inclusos */
  const esco=String(o.escopo||'').split('\n').map(s=>s.trim().replace(/^[-•*·]\s*/,'')).filter(Boolean);
  if(P.mostrarEscopo&&esco.length){
    font('normal',9.2);const two=esco.length>4;const cw=two?CW/2-4:CW;const half=two?Math.ceil(esco.length/2):esco.length;
    const cols=two?[esco.slice(0,half),esco.slice(half)]:[esco];
    const wr=cols.map(c=>c.map(s=>doc.splitTextToSize(T(s),cw-5)));
    const hcol=wr.map(c=>c.reduce((a,l)=>a+l.length*4.1+1.5,0));const hmax=Math.max(...hcol);
    ensure(hmax+9);label('Serviços inclusos',M,y+2);y+=5;
    wr.forEach((c,ci)=>{let yy=y+2;const x=M+ci*(CW/2+4);c.forEach(l=>{fill(C.blue);doc.circle(x+1.3,yy+1.9,0.75,'F');font('normal',9.2);color(C.text);doc.text(l,x+4.2,yy+3);yy+=l.length*4.1+1.5})});
    y+=hmax+6;
  }

  /* Itens */
  const sep=P.modo!=='total';const its=(o.itens||[]);const hasTit=its.some(i=>i.tipo==='titulo');
  let groups=[];
  if(hasTit||!P.agrupar){let cur={titulo:null,itens:[]};groups.push(cur);its.forEach(it=>{if(it.tipo==='titulo'){cur={titulo:it.descricao||'',itens:[]};groups.push(cur)}else cur.itens.push(it)});groups=groups.filter(g=>g.itens.length||g.titulo)}
  else groups=[['servico','Mão de obra'],['material','Materiais utilizados'],['adicional','Serviços adicionais']].map(([t,n])=>({titulo:n,itens:its.filter(i=>i.tipo===t)})).filter(g=>g.itens.length);
  const headRow=sep?[['Descrição','Qtd.','Un.','Valor unit.','Total']]:[['Descrição','Qtd.','Un.']];const nc=headRow[0].length;
  const SEC={fillColor:C.soft,textColor:C.navy,fontStyle:'bold',fontSize:8};
  const body=[];
  groups.forEach(g=>{
    if(g.titulo!==null&&g.titulo!==undefined){const st=g.itens.reduce((a,i)=>a+num(i.qtd)*num(i.valor),0);
      if(sep&&g.itens.length)body.push([{content:T(g.titulo).toUpperCase(),colSpan:nc-1,styles:SEC},{content:money(st),styles:{...SEC,halign:'right'}}]);
      else body.push([{content:T(g.titulo).toUpperCase(),colSpan:nc,styles:SEC}])}
    g.itens.forEach(it=>{const r=[T(it.descricao||'-'),fmtQtd(it.qtd),T(it.unidade||'')];if(sep)r.push(money(it.valor),money(num(it.qtd)*num(it.valor)));body.push(r)});
  });
  if(body.length){
    ensure(26);label(sep?'Mão de obra, materiais e valores':'Descrição dos serviços e materiais',M,y+2);y+=4;
    doc.autoTable({startY:y,head:headRow,body,theme:'plain',margin:{left:M,right:M,top:TOP,bottom:H-BOT},
      styles:{font:'helvetica',fontSize:9,textColor:C.text,cellPadding:{top:2.3,bottom:2.3,left:3,right:3},overflow:'linebreak',valign:'middle'},
      headStyles:{fillColor:C.navy,textColor:C.white,fontStyle:'bold',fontSize:8},
      columnStyles:sep?{1:{halign:'center',cellWidth:15},2:{halign:'center',cellWidth:17},3:{halign:'right',cellWidth:28},4:{halign:'right',cellWidth:30,fontStyle:'bold'}}:{1:{halign:'center',cellWidth:20},2:{halign:'center',cellWidth:22}},
      didParseCell:dt=>{if(dt.section==='head'&&dt.column.index>0)dt.cell.styles.halign=sep&&dt.column.index>=3?'right':'center'},
      didDrawCell:dt=>{if(dt.section==='body'){stroke(C.line);doc.setLineWidth(0.2);doc.line(dt.cell.x,dt.cell.y+dt.cell.height,dt.cell.x+dt.cell.width,dt.cell.y+dt.cell.height)}}
    });
    y=doc.lastAutoTable.finalY+6;
  }

  /* Totais */
  const c=calc(o);
  if(sep){
    const ln=[['Mão de obra',c.mo],['Materiais',c.mat]];if(c.ad)ln.push(['Serviços adicionais',c.ad]);

    if(c.desc)ln.push(['Desconto'+(o.descontoTipo==='%'?` (${fmtQtd(o.descontoValor)}%)`:''),-c.desc]);

function carregarLogo(file){
  if(!file)return;if(!/^image\//.test(file.type)){toast('Escolha um arquivo de imagem.',true);return}
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const mx=420;const k=Math.min(1,mx/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let data=cv.toDataURL('image/png');if(data.length>180000)data=cv.toDataURL('image/jpeg',0.86);S.config={...lerCfg(),logo:data};$('#logo-prev').innerHTML=`<img src="${data}" alt="Logotipo">`;toast('Logo carregado. Clique em Salvar configurações.')};img.onerror=()=>toast('Não foi possível ler a imagem.',true);img.src=r.result};r.readAsDataURL(file);

let filtT=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){const [v,k]=t.dataset.filter.split('.');S.f[v][k]=t.value;clearTimeout(filtT);filtT=setTimeout(()=>{const l=$('#list');if(!l)return;
    l.innerHTML=v==='precos'?precoList():v==='clientes'?cliList():v==='orcamentos'?orcList():v==='modelos'?modList(S.data.modelos.filter(m=>!S.f.modelos.q||norm(m.nome+' '+(m.descricao||'')).includes(norm(S.f.modelos.q))).sort(byName)):catList(v);
    if(v==='precos'&&k==='tipo'){const f=$('.filters');if(f)f.outerHTML=precoFilters()}},t.tagName==='INPUT'&&t.type!=='date'?120:0);return}
  if(!S.draft)return;
  if(t.dataset.bind){const val=t.type==='checkbox'?t.checked:t.value;setPath(S.draft,t.dataset.bind,['descontoValor'].includes(t.dataset.bind)?num(val):val);markDirty();return}
  if(t.dataset.item){const it=S.draft.itens.find(i=>i.id===t.dataset.item);if(!it)return;const f=t.dataset.f;it[f]=(f==='qtd'||f==='valor')?num(t.value):t.value;
    if(f==='qtd'||f==='valor'){const s=$(`[data-sub="${it.id}"]`);if(s)s.textContent=brl(num(it.qtd)*num(it.valor));const h=$(`[data-hint="${it.id}"]`);const c=findCat(it);if(h)h.textContent=c&&r2(c.valor)!==r2(it.valor)?'Tabela: '+brl(c.valor):''}
    markDirty();return}
  if(t.dataset.taxa){const x=S.draft.taxas.find(i=>i.id===t.dataset.taxa);if(x){x[t.dataset.f]=t.dataset.f==='valor'?num(t.value):t.value;markDirty()}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-money]'))t.value=fmtNum(t.value);
  if(t.dataset.preco){const x=[...S.data.servicos,...S.data.materiais].find(i=>i.id===t.dataset.preco);const v=r2(t.value);if(x){if(v===r2(x.valor))delete S.precoPend[x.id];else S.precoPend[x.id]={t:t.dataset.t,valor:v};t.style.cssText=S.precoPend[x.id]?'max-width:140px;border-color:var(--warn);background:var(--warn-soft)':'max-width:140px';precoBtns()}return}
  if(t.id==='cfg-logo'){carregarLogo(t.files[0]);t.value='';return}
  if(t.id==='bk-imp'){const f=t.files[0];t.value='';if(f)importar(f);return}
  const ch=t.dataset.chg;if(!ch)return;
  if(ch==='status-row'){t.className='st-sel st-'+t.value;await mudarStatus(t.dataset.id,t.value)}
  else if(ch==='cat-ativo'){const col=t.dataset.col;const x=S.data[col].find(i=>i.id===t.dataset.id);if(x){try{await DB.put(col,{...x,ativo:t.checked});refreshList()}catch(err){dbErr(err);t.checked=!t.checked}}}
  else if(ch==='ed-cliente'){const c=S.data.clientes.find(x=>x.id===t.value);if(c){S.draft.clienteId=c.id;S.draft.cliente={nome:c.nome,telefone:c.telefone||'',doc:c.doc||'',endereco:c.endereco||''}}else{S.draft.clienteId='';S.draft.cliente={nome:'',telefone:'',doc:'',endereco:''}}markDirty();render()}
  else if(ch==='it-tipo'){const it=S.draft.itens.find(i=>i.id===t.dataset.id);if(it){it.tipo=t.value;if(it.refId&&!findCat(it))it.refId='';t.className='tsel t-'+t.value;markDirty()}}
});

   <div class="auth-err" id="lg-err"></div><button class="btn btn-primary btn-lg" type="submit">Entrar</button></form>`;
  $('#f-login').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('#lg-err').textContent='';

async function abrirSupa(){
  document.body.classList.add('auth');$('#view').innerHTML='<div class="loading"><div><div class="spin"></div>Carregando seus dados…</div></div>';
  try{await Supa.load()}catch(e){console.error(e);const m=String(e&&(e.message||e.code)||e);
    const semTabela=/registros|does not exist|schema cache|PGRST205|42P01/i.test(m);
    S.mode='supabase';telaErro(semTabela?'A tabela do aplicativo ainda não existe no Supabase. Abra o SQL Editor do Supabase, cole o conteúdo do arquivo supabase/schema.sql do repositório e clique em Run.':'Verifique a internet e tente novamente. Seus dados continuam salvos no Supabase.',m);return}
  backend=Supa;S.mode='supabase';document.body.classList.remove('auth');finalizar();
}
function finalizar(){
  S.config={...DEFAULT_CONFIG,...S.config,padrao:{...DEFAULT_CONFIG.padrao,...((S.config||{}).padrao||{})}};
  const h=location.hash.slice(1);S.view=VIEWS_OK.includes(h)&&h!=='orcamento'&&h!=='modelo'?h:'painel';
  if(location.hash.slice(1)!==S.view)history.replaceState(null,'','#'+S.view);
  render();
}
async function boot(){
  renderSide();
  let ok=false;
  if(window.claude&&typeof window.claude.use==='function'){
    $('#view').innerHTML='<div class="loading"><div><div class="spin"></div>Conectando ao banco de dados…</div></div>';
    try{ok=await Cloud.init();if(ok){backend=Cloud;S.mode='nuvem'}}
    catch(e){console.error(e);if(Cloud.db){telaErro('A conexão demorou demais ou falhou. Verifique a internet e tente novamente. Seus dados continuam salvos.');return}}
  }else{
    let local=false;try{local=localStorage.getItem('refricar_modo_local')==='1'}catch(e){}
    if(Supa.cfg()&&!local){
      try{await Supa.init()}catch(e){console.error(e);S.mode='supabase';telaErro('Não foi possível carregar a conexão com o Supabase. Verifique a internet e recarregue a página.');return}
      if(!Supa.user){telaLogin();return}
      await abrirSupa();return;
    }
    if(!local&&/^https?:$/.test(location.protocol)&&window.REFRICAR_CONFIG){telaSetup();return}
  }
  if(!ok){try{await Local.init();backend=Local;S.mode='local';await FileLink.load()}catch(e){console.error(e);backend=Mem;S.mode='memoria'}}
  finalizar();
}
boot();
})();
</script>
